# Non-secret configuration. Secrets live in .env (see .env.example).

storage:
  db_path: data/sentiment.duckdb

logging:
  log_dir: logs
  level: INFO

collect:
  # Each daily run looks back this far. Overlapping with the previous run is
  # deliberate: upserts make it harmless, and it covers a missed or late run.
  lookback_hours: 36

reddit:
  communities:
    - wallstreetbets
    - stocks
    - investing
    - options
    - StockMarket
    - SecurityAnalysis
  # Reddit listings cap at ~1000 items; "new" is walked until posts are older than `since`.
  max_posts_per_community: 1000
  # Author age/karma cost one extra API call per distinct author, so it can be switched off.
  fetch_author_details: true
  # Retry/backoff for transient API errors (per community).
  max_retries: 3
  backoff_seconds: 5
  # Bot accounts whose posts are dropped at collection.
  exclude_authors: [AutoModerator, VisualMod]

news:
  enabled: true              # needs FINNHUB_API_KEY in .env (free, personal use)
  max_tickers: 50            # one request each per run
  mention_lookback_days: 7   # pick the most-mentioned tickers from this window
  pause_seconds: 1.1         # free tier: 60 calls/minute

stocktwits:
  enabled: false             # needs STOCKTWITS_ACCESS_TOKEN from an approved app
  max_tickers: 30
  max_pages: 3               # 30 messages per page
  pause_seconds: 2.0

universe:
  exchanges: [NASDAQ, NYSE, NYSE American]
  min_market_cap: 300_000_000        # USD
  min_avg_dollar_volume: 5_000_000   # USD/day, trailing 30 sessions
  # Refuse to replace the universe if fewer listings than this have market
  # data (i.e. the data source was down or rate-limiting).
  min_data_coverage: 0.5
  yfinance:
    chunk_size: 200
    pause_seconds: 1.0

extraction:
  confidence:
    cashtag: 0.95
    alias: 0.75
    bare: 0.5
    source: 0.9              # ticker named by the source itself (news "related", StockTwits symbol)
  # 1-letter tickers (F, T, V, C) only match via cashtag or alias.
  bare_min_length: 2
  # Skip bare matches on a line with this many all-caps non-ticker words.
  shouting_min_words: 3
  # Any of these (or a $ amount / %) counts as finance context for bare matches.
  finance_context_words: [
    stock, stocks, share, shares, calls, puts, call, put, options, option,
    strike, expiry, earnings, revenue, guidance, eps, dividend, buy, bought,
    sell, sold, selling, buying, short, shorts, long, position, portfolio,
    bull, bullish, bear, bearish, price, target, valuation, ticker, market,
    rally, dip, squeeze, ipo, analyst, upgrade, downgrade, chart, support,
    resistance, hold, holding, invest, investing, trade, trading, yolo, dd,
  ]

scoring:
  model_name: ProsusAI/finbert
  batch_size: 16
  max_chars: 2000        # text per (post, ticker) sent to the model
  commit_every: 256      # pairs per committed chunk

signals:
  sentiment_model: finbert
  # Matches below this confidence are ignored (0.5 keeps bare matches).
  min_match_confidence: 0.5
  source_weights:
    reddit: 1.0
    news: 1.0
    stocktwits: 1.0
  author_cap_per_ticker_week: 5
  noise:
    # News has no upvotes: treat each article as if it had this much engagement.
    engagement_floor:
      news: 10
    near_duplicates:
      max_hamming: 3         # SimHash bits apart (of 64) to count as a repost
      min_words: 12          # shorter posts are only checked for exact copies
    spam_patterns:
    # Regexes, single-quoted so backslashes stay literal.
      - 'join (my|our) (discord|telegram)'
      - 't\.me/'
      - 'discord\.gg/'
      - 'free (stock )?signals'
      - '\bdm me\b'
      - 'whatsapp'
      - 'guaranteed (gains|returns|profit)'
    authors:                 # weight 0 drops; missing age/karma is not penalised
      reddit:
        min_age_days: 30
        new_account_weight: 0.25
        min_karma: 100
        low_karma_weight: 0.5
      stocktwits:            # "karma" is follower count here
        min_age_days: 30
        new_account_weight: 0.25
        min_karma: 5
        low_karma_weight: 0.5
    bots:                    # more posts than this in a week looks automated
      sources: [reddit, stocktwits]
      max_posts_per_week: 40
      weight: 0.1
  baseline_days: 30
  # Baseline std floor (in weighted mentions/day) so quiet tickers don't blow up.
  attention_std_floor: 1.0
  attention_clip: 10
  # Eligibility
  min_weekly_mentions: 20
  min_distinct_authors: 5
  composite_weights:
    attention: 0.35
    sentiment: 0.35
    momentum: 0.15
    breadth: 0.15
  top_n: 20

prices:
  # Daily: refresh this many days of bars for tickers mentioned recently.
  daily_refresh_days: 10
  recent_mention_days: 30
  # Weekly: re-fetch this many days for eligible tickers before computing
  # context, so split/dividend adjustments are consistent across the window.
  context_days: 60

context:
  ret_short_sessions: 5
  ret_long_sessions: 21      # ~30 calendar days
  rel_volume_baseline_days: 30
  early_chatter:
    top_quantile: 0.9        # composite in the top decile (bull or bear)
    max_abs_ret_5d: 0.03     # price hasn't moved yet
    min_rel_volume: 1.2      # but volume is picking up
  divergence_warning:        # rising volume + falling price + bullish chatter
    min_rel_volume: 1.2
    min_price_drop: 0.02     # 5-day fall bigger than this counts as "falling"

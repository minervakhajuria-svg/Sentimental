[project]
name = "sentiment-analyser"
version = "0.1.0"
description = "Weekly screening of shifting attention and sentiment on US stocks. Screening aid only, not investment advice."
requires-python = ">=3.11"
dependencies = [
    "praw>=7.7",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "yfinance>=0.2.50",
    "pandas>=2.0",
    "torch>=2.4",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
storage = ["schema.sql"]
tickers = ["aliases.csv", "blocklist.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
